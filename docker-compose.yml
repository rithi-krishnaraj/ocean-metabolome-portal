services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ocean-backend
    volumes:
      - ./backend/datasets:/app/datasets:rw
    networks:
      - default
    restart: unless-stopped
    env_file:
      - .env   # provides ADMIN_PASSWORD
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ocean-frontend
    ports:
      - "8009:80"
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ocean-metabolome-portal.org
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ocean-metabolome-portal.org
      LETSENCRYPT_EMAIL: mwang87@gmail.com

networks:
  nginx-net:
    external: true
    name: nginx-net
